name: Build Example Watchfaces
on:
  push:
    branches:
      - "dev"
  pull_request:
    branches:
      - "dev"
jobs:
  build:
    name: Build Example Watchfaces
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@master
    - name: Install pinned Rtc_Pcf8563 + patched WiFiManager (registry versions are broken/incompatible, see README)
      run: |
        mkdir -p ~/Arduino/libraries
        git clone --quiet https://github.com/orbitalair/Rtc_Pcf8563.git ~/Arduino/libraries/Rtc_Pcf8563
        git -C ~/Arduino/libraries/Rtc_Pcf8563 checkout --quiet 7e2ece1e5b
        git clone --quiet --branch v2.0.17 https://github.com/tzapu/WiFiManager.git ~/Arduino/libraries/WiFiManager
        cp third_party/wifimanager-patched/*.h third_party/wifimanager-patched/*.cpp ~/Arduino/libraries/WiFiManager/
    - uses: ArminJo/arduino-test-compile@v3
      with:
        arduino-board-fqbn: esp32:esp32:watchy:Revision=v20,PartitionScheme=min_spiffs,UploadSpeed=921600,DebugLevel=none,EraseFlash=none
        platform-url: https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
        arduino-platform: esp32:esp32@2.0.17
        required-libraries: Adafruit GFX Library,Arduino_JSON,DS3232RTC,NTPClient,GxEPD2,NimBLE-Arduino
        set-build-path: true
    - uses: actions/upload-artifact@v3
      with:
        name: binaries
        path: ${{ github.workspace }}/examples/WatchFaces/**/build/*.bin
    - uses: actions/download-artifact@v3
    - name: Display structure of downloaded files
      run: ls -R
